services:
  postgres:
    image: postgres:16.6-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Укажите POSTGRES_DB в .env}
      POSTGRES_USER: ${POSTGRES_USER:?Укажите POSTGRES_USER в .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Укажите POSTGRES_PASSWORD в .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:?Укажите POSTGRES_PORT в .env}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  postgres_data:
